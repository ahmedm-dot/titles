# One-click deploy on Render (https://render.com): New → Blueprint → pick this repo.
services:
  - type: web
    name: chat-tracker
    runtime: node
    rootDir: rocketchat-tracker
    plan: free
    buildCommand: "true"
    startCommand: node server.js
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: RC_URL
        value: https://rc1.infrozix.com
      - key: RC_USER_ID
        sync: false
      - key: RC_TOKEN
        sync: false
      - key: BOARD_PASSWORD
        sync: false
      - key: WATCH_KEYWORDS
        value: requirement,urgent,asap,blocker,ats,auto apply,resumedone
      - key: MUTED_ROOMS
        value: general,random
