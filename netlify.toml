# Netlify: LLM Eval web app (llm-eval/web). Netlify detects Next.js and adds its runtime.
[build]
  base = "llm-eval/web"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Netlify's Next.js runtime (normally auto-detected; declared so it's never skipped)
[[plugins]]
  package = "@netlify/plugin-nextjs"
